name: Build Farm Viet V12 iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      # =====================================================
      # PREPARE
      # =====================================================

      - name: Prepare FarmViet
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING FARMVIET"
          echo "========================================"

          echo ""
          echo "Checking Xcode project..."

          test -d "FarmViet.xcodeproj"
          test -f "FarmViet.xcodeproj/project.pbxproj"

          echo "Xcode project OK"

          rm -rf "FarmViet"
          mkdir -p "FarmViet"

          # -------------------------------------------------
          # Swift files
          # -------------------------------------------------

          cp -f "FarmVietApp.swift" "FarmViet/"
          cp -f "FarmView.swift" "FarmViet/"
          cp -f "GameScene.swift" "FarmViet/"
          cp -f "Info.plist" "FarmViet/"

          echo "Swift files copied"

          # -------------------------------------------------
          # Copy root image files
          # -------------------------------------------------

          python3 <<'PY'
          import os
          import shutil

          destination = "FarmViet"

          extensions = {
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".wav",
              ".mp3",
              ".m4a"
          }

          copied = 0

          for name in os.listdir("."):

              path = os.path.join(".", name)

              if not os.path.isfile(path):
                  continue

              ext = os.path.splitext(name)[1].lower()

              if ext not in extensions:
                  continue

              target = os.path.join(destination, name)

              shutil.copy2(path, target)

              print("ROOT ASSET:", name)

              copied += 1

          print("Root assets copied:", copied)
          PY

          # -------------------------------------------------
          # Copy Resources and Assets
          # -------------------------------------------------

          python3 <<'PY'
          import os
          import shutil

          destination = "FarmViet"

          extensions = {
              ".png",
              ".jpg",
              ".jpeg",
              ".gif",
              ".wav",
              ".mp3",
              ".m4a"
          }

          for source_root in ["Resources", "Assets"]:

              if not os.path.isdir(source_root):
                  continue

              for root, dirs, files in os.walk(source_root):

                  for name in files:

                      ext = os.path.splitext(name)[1].lower()

                      if ext not in extensions:
                          continue

                      source = os.path.join(root, name)
                      target = os.path.join(destination, name)

                      # Don't overwrite a root asset with another copy.
                      if os.path.exists(target):
                          print(
                              "SKIP EXISTING:",
                              name
                          )
                          continue

                      shutil.copy2(source, target)

                      print(
                          "COPIED:",
                          source,
                          "->",
                          target
                      )

          PY

          # =================================================
          # KNOWN ASSET ALIASES
          # =================================================

          echo ""
          echo "========================================"
          echo "CREATING ASSET ALIASES"
          echo "========================================"

          # WaterTile
          if [ ! -f "FarmViet/WaterTile.png" ]; then

            if [ -f "FarmViet/Water.png" ]; then

              cp -f \
                "FarmViet/Water.png" \
                "FarmViet/WaterTile.png"

              echo "Created WaterTile.png"

            fi

          fi

          # PierTile
          if [ ! -f "FarmViet/PierTile.png" ]; then

            if [ -f "FarmViet/Pier_Tiles.png" ]; then

              cp -f \
                "FarmViet/Pier_Tiles.png" \
                "FarmViet/PierTile.png"

              echo "Created PierTile.png"

            fi

          fi

          # =================================================
          # FISHERMAN FRAME ALIASES
          # =================================================

          python3 <<'PY'
          import os
          import shutil

          directory = "FarmViet"

          bases = [
              "Fisherman_idle",
              "Fisherman_walk",
              "Fisherman_row",
              "Fisherman_fish",
              "Fisherman_hook"
          ]

          for base in bases:

              original = os.path.join(
                  directory,
                  base + ".png"
              )

              if not os.path.isfile(original):
                  continue

              for number in range(0, 21):

                  target = os.path.join(
                      directory,
                      f"{base}_{number}.png"
                  )

                  if os.path.isfile(target):
                      continue

                  shutil.copy2(
                      original,
                      target
                  )

                  print(
                      "FRAME ALIAS:",
                      os.path.basename(target)
                  )

          PY

          # =================================================
          # CHECK FILES
          # =================================================

          echo ""
          echo "========================================"
          echo "FARMVIET FILE CHECK"
          echo "========================================"

          test -f "FarmViet/FarmVietApp.swift" || true
          test -f "FarmViet/FarmView.swift" || true
          test -f "FarmViet/GameScene.swift" || true
          test -f "FarmViet/Info.plist"

          echo ""
          echo "Water:"
          ls -lh "FarmViet/Water.png" 2>/dev/null || true
          ls -lh "FarmViet/WaterTile.png" 2>/dev/null || true

          echo ""
          echo "Pier:"
          ls -lh "FarmViet/Pier_Tiles.png" 2>/dev/null || true
          ls -lh "FarmViet/PierTile.png" 2>/dev/null || true

          echo ""
          echo "Fisherman:"
          ls -1 "FarmViet"/Fisherman_*.png 2>/dev/null | sort || true

          echo ""
          echo "Total files:"

          python3 - <<'PY'
          import os

          files = [
              x for x in os.listdir("FarmViet")
              if os.path.isfile(
                  os.path.join("FarmViet", x)
              )
          ]

          print(len(files))
          PY

          echo ""
          echo "PREPARE COMPLETE"

      # =====================================================
      # SELECT XCODE
      # =====================================================

      - name: Select Xcode
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "XCODE"
          echo "========================================"

          sudo xcode-select \
            -s /Applications/Xcode.app/Contents/Developer

          xcodebuild -version

          echo ""

          xcrun --sdk iphoneos --show-sdk-path

      # =====================================================
      # CHECK PROJECT
      # =====================================================

      - name: Inspect Xcode project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "XCODE PROJECT"
          echo "========================================"

          xcodebuild \
            -project "FarmViet.xcodeproj" \
            -list

      # =====================================================
      # BUILD
      # =====================================================

      - name: Build Farm Viet
        shell: bash
        run: |
          set -o pipefail

          echo "========================================"
          echo "BUILD FARM VIET"
          echo "========================================"

          rm -rf "build"
          mkdir -p "build"

          xcodebuild -project "FarmViet.xcodeproj" -scheme "FarmViet" -configuration "Release" -sdk "iphoneos" -derivedDataPath "build/DerivedData" SDKROOT=iphoneos SUPPORTED_PLATFORMS=iphoneos TARGETED_DEVICE_FAMILY="1,2" IPHONEOS_DEPLOYMENT_TARGET=16.0 SUPPORTS_MACCATALYST=NO CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" clean build 2>&1 | tee "build/xcodebuild.log"

      # =====================================================
      # SHOW ERRORS
      # =====================================================

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo ""
          echo "========================================"
          echo "BUILD FAILED"
          echo "========================================"

          if [ -f "build/xcodebuild.log" ]; then

            echo ""
            echo "ERRORS:"
            echo "----------------------------------------"

            grep -n -E "error:|fatal error|BUILD FAILED" "build/xcodebuild.log" || true

            echo ""
            echo "LAST 250 LINES:"
            echo "----------------------------------------"

            tail -n 250 "build/xcodebuild.log"

          fi

      # =====================================================
      # FIND APP
      # =====================================================

      - name: Find FarmViet app
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "FIND FARMVIET.APP"
          echo "========================================"

          APP=$(find "build/DerivedData" -type d -name "FarmViet.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "FarmViet.app NOT FOUND"
            exit 1
          fi

          echo "APP:"
          echo "$APP"

      # =====================================================
      # CREATE IPA
      # =====================================================

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "CREATE UNSIGNED IPA"
          echo "========================================"

          APP=$(find "build/DerivedData" -type d -name "FarmViet.app" | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: FarmViet.app not found"
            exit 1
          fi

          rm -rf "build/Payload"

          mkdir -p "build/Payload"

          cp -R \
            "$APP" \
            "build/Payload/FarmViet.app"

          cd "build"

          rm -f "FarmViet-V12-unsigned.ipa"

          zip -r \
            "FarmViet-V12-unsigned.ipa" \
            "Payload"

          echo ""
          echo "========================================"
          echo "IPA CREATED"
          echo "========================================"

          ls -lh "FarmViet-V12-unsigned.ipa"

      # =====================================================
      # UPLOAD IPA
      # =====================================================

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FarmViet-V12-unsigned-IPA
          path: build/FarmViet-V12-unsigned.ipa
          if-no-files-found: error

      # =====================================================
      # UPLOAD LOG
      # =====================================================

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarmViet-V12-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
