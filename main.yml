name: Build Farm Viet V12 iOS

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ios:
    name: Build unsigned IPA
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare Xcode source tree
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "PREPARING FARMVIET"
          echo "========================================"

          test -d FarmViet.xcodeproj
          test -f FarmViet.xcodeproj/project.pbxproj

          rm -rf FarmViet
          mkdir -p FarmViet

          cp -f FarmVietApp.swift FarmViet/
          cp -f FarmView.swift FarmViet/
          cp -f GameScene.swift FarmViet/
          cp -f Info.plist FarmViet/

          # Copy every supplied image into the flat resource directory
          # because the generated Xcode project references filenames directly.
          find . -maxdepth 1 -type f \\
            \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) \\
            -exec cp -f {} FarmViet/ \;

          if [ -d Resources ]; then
            find Resources -type f \\
              \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) \\
              -exec cp -f {} FarmViet/ \;
          fi

          if [ -d Assets ]; then
            find Assets -type f \\
              \( -iname '*.png' -o -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.gif' \) \\
              -exec cp -f {} FarmViet/ \;
          fi

          # Known aliases used by the Xcode project.
          if [ ! -f FarmViet/WaterTile.png ] && [ -f FarmViet/Water.png ]; then
            cp -f FarmViet/Water.png FarmViet/WaterTile.png
          fi

          if [ ! -f FarmViet/PierTile.png ] && [ -f FarmViet/Pier_Tiles.png ]; then
            cp -f FarmViet/Pier_Tiles.png FarmViet/PierTile.png
          fi

          # The animation project references numbered frames. The supplied
          # asset pack contains sprite sheets/base images, so make safe aliases
          # when an individual numbered frame is absent.
          for BASE in \\
            Fisherman_idle \\
            Fisherman_walk \\
            Fisherman_row \\
            Fisherman_fish \\
            Fisherman_hook
          do
            if [ -f "FarmViet/${BASE}.png" ]; then
              for N in 0 1 2 3 4 5; do
                if [ ! -f "FarmViet/${BASE}_${N}.png" ]; then
                  cp -f "FarmViet/${BASE}.png" "FarmViet/${BASE}_${N}.png"
                fi
              done
            fi
          done

          echo ""
          echo "Required animation files:"
          ls -1 FarmViet/Fisherman_* 2>/dev/null | sort || true

          echo ""
          echo "Required tile files:"
          ls -l FarmViet/WaterTile.png FarmViet/PierTile.png

      - name: Select Xcode
        shell: bash
        run: |
          set -e
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-path

      - name: Inspect project
        shell: bash
        run: |
          set -e
          xcodebuild -project FarmViet.xcodeproj -list

      - name: Build Farm Viet
        shell: bash
        run: |
          set -o pipefail

          rm -rf build
          mkdir -p build

          xcodebuild \\
            -project FarmViet.xcodeproj \\
            -scheme FarmViet \\
            -configuration Release \\
            -sdk iphoneos \\
            -derivedDataPath build/DerivedData \\
            SDKROOT=iphoneos \\
            SUPPORTED_PLATFORMS=iphoneos \\
            TARGETED_DEVICE_FAMILY="1,2" \\
            IPHONEOS_DEPLOYMENT_TARGET=16.0 \\
            SUPPORTS_MACCATALYST=NO \\
            CODE_SIGNING_ALLOWED=NO \\
            CODE_SIGNING_REQUIRED=NO \\
            CODE_SIGN_IDENTITY="" \\
            clean build \\
            2>&1 | tee build/xcodebuild.log

      - name: Show build errors
        if: failure()
        shell: bash
        run: |
          echo "========================================"
          echo "BUILD ERRORS"
          echo "========================================"
          if [ -f build/xcodebuild.log ]; then
            grep -n -E 'error:|fatal error|BUILD FAILED' build/xcodebuild.log || true
            echo ""
            echo "Last 250 lines:"
            tail -n 250 build/xcodebuild.log
          fi

      - name: Create unsigned IPA
        shell: bash
        run: |
          set -e

          APP=$(find build/DerivedData -type d -name 'FarmViet.app' | head -n 1)
          test -n "$APP"

          rm -rf build/Payload
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/FarmViet.app

          cd build
          rm -f FarmViet-V12-unsigned.ipa
          zip -r FarmViet-V12-unsigned.ipa Payload

          ls -lh FarmViet-V12-unsigned.ipa

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: FarmViet-V12-unsigned-IPA
          path: build/FarmViet-V12-unsigned.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FarmViet-V12-build-log
          path: build/xcodebuild.log
          if-no-files-found: ignore
